; supervisord configuration for CloudNotes
; -----------------------------------------
; This is the "managed service" for the Codespaces / container environment,
; playing the same role systemd plays on a VM:
;   - starts CloudNotes (via gunicorn) automatically when supervisord starts
;   - restarts it automatically if the process crashes (autorestart=true)
;
; supervisord itself is launched when the Codespace starts (see
; .devcontainer/devcontainer.json -> postStartCommand), so the app comes back
; after the Codespace is stopped and restarted — the container's equivalent of
; "starts on boot".
;
; Start it manually with:   supervisord -c deploy/supervisord.conf
; Check status with:        supervisorctl -c deploy/supervisord.conf status
; Restart the app with:     supervisorctl -c deploy/supervisord.conf restart cloudnotes

[supervisord]
nodaemon=false
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:cloudnotes]
; Run the app through gunicorn, bound to all interfaces on port 5000 so the
; forwarded Codespaces port can reach it.
command=gunicorn --bind 0.0.0.0:5000 --workers 2 app:app
directory=%(ENV_CLOUDNOTES_DIR)s
autostart=true
autorestart=true
startretries=5
startsecs=3
stopasgroup=true
killasgroup=true
; Inherit the environment (DATABASE_URL, SECRET_KEY, ...) from the shell that
; launches supervisord; see deploy/start.sh which loads .env first.
stdout_logfile=/tmp/cloudnotes.out.log
stderr_logfile=/tmp/cloudnotes.err.log
